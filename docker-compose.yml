version: '3.8'

services:
  # 1. Aplicación Laravel (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vidasalud_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - vidasalud_network
    depends_on:
      - postgres

  # 1b. Tarea programada (CU31): ejecuta el Scheduler de Laravel (recordatorios:enviar cada hora)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vidasalud_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
    networks:
      - vidasalud_network
    depends_on:
      - postgres

  # 2. Servidor Web Nginx (Puerto 8000 expuesto al público)
  nginx:
    image: nginx:alpine
    container_name: vidasalud_nginx
    restart: unless-stopped
    ports:
      - "8000:80"   # acceso original http://IP:8000
      - "80:80"     # HTTP y validacion de Let's Encrypt
      - "443:443"   # HTTPS (necesario para el microfono del comando de voz - CU29)
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - vidasalud_network
    depends_on:
      - app

  # 3. Base de Datos PostgreSQL (RN14 / RNF01 del Examen)
  postgres:
    image: postgres:16-alpine
    container_name: vidasalud_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bd_vida_salud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"   # abierto a proposito para conectarse con pgAdmin 4 (restringir la IP en el Security Group)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vidasalud_network

networks:
  vidasalud_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
